<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; }
  .phone {
    width: 390px; height: 844px; overflow: hidden; position: relative;
    background:
      linear-gradient(180deg, #070a11 0%, #0a0e17 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 26px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 26px);
    font-family: 'Chakra Petch', sans-serif; color: #eaf6ff;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 0 0 1px rgba(41,241,255,0.15), 0 30px 70px rgba(0,0,0,0.6);
    --magenta: #ff2f9e; --cyan: #29f1ff;
  }
  a { color: #29f1ff; }
  a:hover { color: #6ff8ff; }

  .scan-overlay {
    position: absolute; left: 0; right: 0; top: -120px; height: 120px; pointer-events: none; z-index: 5;
    background: linear-gradient(180deg, rgba(41,241,255,0) 0%, rgba(41,241,255,0.05) 45%, rgba(41,241,255,0.14) 50%, rgba(41,241,255,0.05) 55%, rgba(41,241,255,0) 100%);
    mix-blend-mode: screen; animation: scanMove 5.5s linear infinite;
  }
  @keyframes scanMove { 0% { transform: translateY(0); } 100% { transform: translateY(964px); } }

  @keyframes glitchFlicker {
    0%, 92%, 100% { text-shadow: 0 0 16px rgba(255,47,158,0.4); }
    93% { text-shadow: 2px 0 rgba(41,241,255,0.6), -2px 0 rgba(255,47,158,0.6); }
    94% { text-shadow: 0 0 16px rgba(255,47,158,0.4); }
  }
  .glitch-num { animation: glitchFlicker 6s infinite; }

  input[type=range].vslider {
    -webkit-appearance: none; appearance: none;
    writing-mode: vertical-lr; direction: rtl;
    width: 14px; height: 300px; background: transparent;
  }
  input[type=range].vslider::-webkit-slider-runnable-track {
    width: 14px; border-radius: 3px;
    background:
      linear-gradient(to top, var(--magenta) 0%, var(--magenta) var(--fill), transparent var(--fill), transparent 100%),
      repeating-linear-gradient(0deg, rgba(41,241,255,0.45) 0px, rgba(41,241,255,0.45) 2px, transparent 2px, transparent 11px);
    box-shadow: 0 0 14px rgba(255,47,158,0.25);
  }
  input[type=range].vslider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%;
    background: #ffffff; margin-left: -8px; box-shadow: 0 0 12px var(--magenta), 0 0 2px #fff;
  }
  input[type=range].vslider::-moz-range-track { width: 14px; border-radius: 3px; background: rgba(41,241,255,0.16); }
  input[type=range].vslider::-moz-range-progress { width: 14px; border-radius: 3px; background: var(--magenta); }
  input[type=range].vslider::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: none; box-shadow: 0 0 12px var(--magenta); }
</style>
</helmet>
<div class="phone">
  <div class="scan-overlay"></div>

  <div style="padding:24px 24px 0 24px; align-self:stretch; position:relative; z-index:2;">
    <div style="font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; color:#5a6472; letter-spacing:0.12em; text-align:center;">OPTIC OUTPUT // DISPLAY</div>
    <div class="glitch-num" style="font-family:'Orbitron', sans-serif; font-size:50px; font-weight:800; text-align:center; margin-top:12px; letter-spacing:0.02em; color:#eaf6ff;">{{brightness}}%</div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; position:relative; z-index:2;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff2f9e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>

    <input type="range" class="vslider" min="0" max="100" value="{{brightness}}" onChange="{{onBrightness}}" style="--fill:{{brightness}}%;" />

    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#29f1ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"><circle cx="12" cy="12" r="3.6"/><path d="M12 5.5V7M12 17v1.5M6.6 6.6l1 1M16.4 16.4l1 1M4.5 12H6M18 12h1.5M6.6 17.4l1-1M16.4 7.6l1-1"/></svg>
  </div>

  <div style="padding-bottom:20px; text-align:center; font-family:'JetBrains Mono', monospace; font-size:10px; color:#4a5568; letter-spacing:0.05em; position:relative; z-index:2;">SYNC :: MACBOOK DISPLAY</div>

  <div style="display:flex; align-items:stretch; justify-content:space-around; padding:12px 10px 22px 10px; border-top:1px solid rgba(41,241,255,0.16); background:rgba(6,9,15,0.75); align-self:stretch; position:relative; z-index:2;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding-top:7px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#3d4656" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
      <span style="font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.08em; color:#3d4656;">GRID</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding-top:7px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#3d4656" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.2"/><circle cx="17" cy="16" r="2.2"/></svg>
      <span style="font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.08em; color:#3d4656;">AUDIO</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; position:relative; padding-top:7px;">
      <span style="position:absolute; top:0; left:50%; transform:translateX(-50%); width:24px; height:2px; background:#ff2f9e; box-shadow:0 0 8px #ff2f9e;"></span>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ff2f9e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
      <span style="font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.08em; color:#ff2f9e;">DISPLAY</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const brightness = this.state.brightness ?? 72;
    return {
      brightness,
      onBrightness: (e) => this.setState({ brightness: Number(e.target.value) }),
    };
  }
}
</script>
</body>
</html>
