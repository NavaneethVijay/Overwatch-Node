<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; }
  .phone {
    width: 390px; height: 844px; overflow: hidden; position: relative;
    background:
      linear-gradient(180deg, #070a11 0%, #0a0e17 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 26px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 26px);
    font-family: 'Chakra Petch', sans-serif; color: #eaf6ff;
    display: flex; flex-direction: column;
    box-shadow: 0 0 0 1px rgba(41,241,255,0.15), 0 30px 70px rgba(0,0,0,0.6);
    --magenta: #ff2f9e; --cyan: #29f1ff;
  }
  a { color: #29f1ff; }
  a:hover { color: #6ff8ff; }

  .scan-overlay {
    position: absolute; left: 0; right: 0; top: -120px; height: 120px; pointer-events: none; z-index: 5;
    background: linear-gradient(180deg, rgba(41,241,255,0) 0%, rgba(41,241,255,0.05) 45%, rgba(41,241,255,0.14) 50%, rgba(41,241,255,0.05) 55%, rgba(41,241,255,0) 100%);
    mix-blend-mode: screen; animation: scanMove 5.5s linear infinite;
  }
  @keyframes scanMove { 0% { transform: translateY(0); } 100% { transform: translateY(964px); } }

  @keyframes glitchFlicker {
    0%, 92%, 100% { text-shadow: 0 0 12px rgba(41,241,255,0.35); }
    93% { text-shadow: 2px 0 rgba(255,47,158,0.6), -2px 0 rgba(41,241,255,0.6); }
    94% { text-shadow: 0 0 12px rgba(41,241,255,0.35); }
  }
  .glitch-title { animation: glitchFlicker 6s infinite; }

  @keyframes waveBar { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  .bar { width: 8px; border-radius: 2px; transform-origin: bottom; background: linear-gradient(180deg, var(--magenta), rgba(255,47,158,0.3)); animation: waveBar 1.1s ease-in-out infinite; }
  .bar-still { width: 8px; border-radius: 2px; background: rgba(41,241,255,0.25); }

  .ctrlbtn { cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform 0.1s ease; }
  .ctrlbtn:active { transform: scale(0.9); }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spin-ring {
    position: absolute; inset: -8px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, var(--magenta) 25%, transparent 55%);
    filter: blur(3px); opacity: 0.8; animation: spin 2.4s linear infinite; z-index: 0;
  }

  input[type=range].hslider { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; background: transparent; }
  input[type=range].hslider::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(to right, var(--magenta) 0%, var(--magenta) var(--fill), rgba(41,241,255,0.16) var(--fill), rgba(41,241,255,0.16) 100%);
  }
  input[type=range].hslider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #ffffff; margin-top: -6px; box-shadow: 0 0 8px var(--magenta);
  }
  input[type=range].hslider::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(41,241,255,0.16); }
  input[type=range].hslider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--magenta); }
  input[type=range].hslider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: none; box-shadow: 0 0 8px var(--magenta); }
</style>
</helmet>
<div class="phone">
  <div class="scan-overlay"></div>

  <div style="padding:24px 24px 4px 24px; position:relative; z-index:2;">
    <div style="font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; color:#5a6472; letter-spacing:0.12em;">SIGNAL // AUDIO STREAM</div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 30px; gap:24px; position:relative; z-index:2;">

    <div style="width:220px; height:220px; clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px); background:rgba(255,255,255,0.03); border:1px solid rgba(41,241,255,0.25); display:flex; align-items:end; justify-content:center; gap:8px; padding-bottom:34px; box-shadow:0 0 26px rgba(41,241,255,0.08) inset;">
      <sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
        <div class="bar" style="height:26px; animation-delay:0s;"></div>
        <div class="bar" style="height:58px; animation-delay:0.15s;"></div>
        <div class="bar" style="height:38px; animation-delay:0.3s;"></div>
        <div class="bar" style="height:72px; animation-delay:0.1s;"></div>
        <div class="bar" style="height:46px; animation-delay:0.35s;"></div>
        <div class="bar" style="height:64px; animation-delay:0.25s;"></div>
      </sc-if>
      <sc-if value="{{notPlaying}}" hint-placeholder-val="{{false}}">
        <div class="bar-still" style="height:20px;"></div>
        <div class="bar-still" style="height:34px;"></div>
        <div class="bar-still" style="height:24px;"></div>
        <div class="bar-still" style="height:44px;"></div>
        <div class="bar-still" style="height:28px;"></div>
        <div class="bar-still" style="height:38px;"></div>
      </sc-if>
    </div>

    <div style="text-align:center;">
      <div class="glitch-title" style="font-family:'Orbitron', sans-serif; font-size:18px; font-weight:800; letter-spacing:0.01em;">SUNSET DRIVE</div>
      <div style="font-family:'JetBrains Mono', monospace; font-size:11px; color:#5a6472; margin-top:6px; letter-spacing:0.06em;">THE NIGHTLIGHTS</div>
    </div>

    <div style="width:100%;">
      <div style="width:100%; height:3px; border-radius:2px; background:rgba(41,241,255,0.16); overflow:hidden;">
        <div style="width:38%; height:100%; background:#ff2f9e; box-shadow:0 0 8px #ff2f9e;"></div>
      </div>
      <div style="display:flex; justify-content:space-between; margin-top:7px;">
        <span style="font-family:'JetBrains Mono', monospace; font-size:10px; color:#5a6472;">01:24</span>
        <span style="font-family:'JetBrains Mono', monospace; font-size:10px; color:#5a6472;">-02:16</span>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:center; gap:32px;">
      <div class="ctrlbtn" style="width:42px; height:42px; border-radius:50%; border:1px solid rgba(41,241,255,0.3); display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#29f1ff"><path d="M18 6v12l-8.5-6z"/><rect x="6.5" y="6" width="2.4" height="12" rx="0.5"/></svg>
      </div>

      <div style="position:relative; width:68px; height:68px; display:flex; align-items:center; justify-content:center;">
        <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><div class="spin-ring"></div></sc-if>
        <sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
          <div class="ctrlbtn" onClick="{{toggle}}" style="position:relative; z-index:1; width:64px; height:64px; border-radius:50%; background:#ff2f9e; display:flex; align-items:center; justify-content:center; box-shadow:0 0 22px rgba(255,47,158,0.55);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#0a0e17"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>
          </div>
        </sc-if>
        <sc-if value="{{notPlaying}}" hint-placeholder-val="{{false}}">
          <div class="ctrlbtn" onClick="{{toggle}}" style="position:relative; z-index:1; width:64px; height:64px; border-radius:50%; background:rgba(41,241,255,0.14); border:1px solid rgba(41,241,255,0.5); display:flex; align-items:center; justify-content:center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#29f1ff"><path d="M8 5.5v13l11-6.5z"/></svg>
          </div>
        </sc-if>
      </div>

      <div class="ctrlbtn" style="width:42px; height:42px; border-radius:50%; border:1px solid rgba(41,241,255,0.3); display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#29f1ff"><path d="M6 6v12l8.5-6z"/><rect x="15.1" y="6" width="2.4" height="12" rx="0.5"/></svg>
      </div>
    </div>

    <div style="width:100%; display:flex; align-items:center; gap:12px;">
      <span style="font-family:'JetBrains Mono', monospace; font-size:9px; color:#4a5568; letter-spacing:0.06em;">OUT</span>
      <input type="range" class="hslider" min="0" max="100" value="{{volume}}" onChange="{{onVolume}}" style="--fill:{{volume}}%;" />
      <span style="font-family:'JetBrains Mono', monospace; font-size:9px; color:#4a5568; letter-spacing:0.06em; min-width:26px; text-align:right;">{{volume}}%</span>
    </div>

  </div>

  <div style="display:flex; align-items:stretch; justify-content:space-around; padding:12px 10px 22px 10px; border-top:1px solid rgba(41,241,255,0.16); background:rgba(6,9,15,0.75); position:relative; z-index:2;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding-top:7px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#3d4656" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
      <span style="font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.08em; color:#3d4656;">GRID</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; position:relative; padding-top:7px;">
      <span style="position:absolute; top:0; left:50%; transform:translateX(-50%); width:24px; height:2px; background:#ff2f9e; box-shadow:0 0 8px #ff2f9e;"></span>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ff2f9e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.2"/><circle cx="17" cy="16" r="2.2"/></svg>
      <span style="font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.08em; color:#ff2f9e;">AUDIO</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:5px; padding-top:7px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#3d4656" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
      <span style="font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.08em; color:#3d4656;">DISPLAY</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const playing = this.state.playing ?? true;
    const volume = this.state.volume ?? 65;
    return {
      playing,
      notPlaying: !playing,
      volume,
      toggle: () => this.setState({ playing: !this.state.playing }),
      onVolume: (e) => this.setState({ volume: Number(e.target.value) }),
    };
  }
}
</script>
</body>
</html>
